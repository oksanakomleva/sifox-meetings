<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #1c1917; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #555; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .primary { background: #2563eb; color: #fff; }
    .danger { background: #dc2626; color: #fff; }
    .secondary { background: #f3f4f6; color: #1c1917; }
    .muted { font-size: 12px; color: #777; }
    .status { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .hidden { display: none; }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #dc2626; display: inline-block; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    a { color: #2563eb; font-size: 12px; cursor: pointer; }
    details { margin-top: 12px; }
    summary { cursor: pointer; }
    .banner { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 13px; color: #7c2d12; }
    .ok-pill { font-size: 12px; color: #16a34a; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Sifox — запись встречи</h1>

  <!-- Not logged in -->
  <div id="login" class="hidden">
    <p class="muted">Войдите в Sifox в этом браузере (через Google), чтобы записывать встречи. Расширение подхватит ваш вход автоматически.</p>
    <button id="openLogin" class="primary">Открыть Sifox и войти</button>
    <div id="loginStatus" class="status"></div>
    <details>
      <summary class="muted">Адрес сервера</summary>
      <input id="baseUrl" type="text" />
    </details>
  </div>

  <!-- Recorder -->
  <div id="recorder" class="hidden">
    <div id="account" class="muted"></div>

    <!-- Mic permission: prominent prompt when NOT granted -->
    <div id="micBanner" class="banner hidden">
      🎤 Чтобы в запись попал ваш голос, разрешите доступ к микрофону. Иначе запишется только звук вкладки.
      <button id="grantMicBig" class="primary">Разрешить доступ к микрофону</button>
    </div>
    <!-- Confirmation when granted -->
    <div id="micOk" class="ok-pill hidden">✓ Микрофон разрешён</div>

    <label>Название встречи</label>
    <input id="title" type="text" />
    <button id="toggle" class="primary">● Начать запись</button>
    <div id="recStatus" class="status"></div>
    <div class="row">
      <a id="openApp">Открыть встречи →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
